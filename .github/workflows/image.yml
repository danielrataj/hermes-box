# Builds the image on every change, so that a Hermes release the Dockerfile
# no longer fits is noticed here and not on a server, and publishes it to
# ghcr.io when a version tag (v1.2.3) is pushed.
#
#   v1.2.3      -> ghcr.io/<owner>/hermes-box:1.2.3, :1.2 and :1
#   v1.2.3-rc.1 -> ghcr.io/<owner>/hermes-box:1.2.3-rc.1 only
#
# Every published image names itself with its full version (release.env), so
# an installation made from :1 stays on 1.2.3 until it is updated on purpose.

name: Image

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts
        run: |
          shellcheck --severity=error \
            install.sh setup.sh check.sh sops.sh \
            backup/*.sh monitor/*.sh deploy/*.sh docker/*.sh

      - name: Name and version
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA::12}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          docker build \
            --build-arg "HERMES_BOX_IMAGE=$IMAGE:$VERSION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" .

      - name: Test the image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          set -euo pipefail
          # The tools the scripts run from the image.
          docker run --rm --network none -e SOPS_DISABLE_VERSION_CHECK=1 --entrypoint sops "$IMAGE:$VERSION" --version
          docker run --rm --network none --entrypoint age-keygen "$IMAGE:$VERSION" --version
          docker run --rm --network none --entrypoint himalaya "$IMAGE:$VERSION" --version
          docker run --rm --network none --entrypoint /opt/hermes/bin/hermes "$IMAGE:$VERSION" --version

          # What an installation gets out of it.
          out="$(mktemp -d)"
          docker run --rm --network none -v "$out:/out" --entrypoint hermes-box-extract "$IMAGE:$VERSION"
          for file in compose.yaml install.sh setup.sh check.sh sops.sh release.env \
                      backup/hermes-backup.sh monitor/hermes-monitor.sh server/hermes-docker.service \
                      caddy/Caddyfile instance.example/env.example; do
            test -s "$out/$file" || { echo "missing in the image: $file"; exit 1; }
          done
          test -x "$out/setup.sh"
          grep -qx "HERMES_BOX_IMAGE=$IMAGE:$VERSION" "$out/release.env"
          # Nothing of an installation may be in a published image.
          test ! -e "$out/instance" && test ! -e "$out/.env" && test ! -e "$out/.git"

          # compose.yaml accepts the extracted files and runs the published image.
          printf 'HERMES_DOMAIN=agent.example.com\n' | sudo tee "$out/.env" >/dev/null
          (cd "$out" && HERMES_BOX_IMAGE="$IMAGE:$VERSION" docker compose config) | grep -q "image: $IMAGE:$VERSION"

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;   # a pre-release does not move :1 and :1.2
            *)
              minor="${VERSION%.*}"; major="${VERSION%%.*}"
              for tag in "$minor" "$major"; do
                docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
                docker push "$IMAGE:$tag"
              done
              ;;
          esac
