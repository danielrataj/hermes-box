# Template; ./install.sh fills in @DATA_DIR@ and installs it as
# /etc/systemd/system/docker.service.d/hermes-volume.conf
#
# Docker restarts containers on its own at boot, before hermes-docker.service
# runs. Without the data volume it would create empty directories in its place
# and the agent would start with blank state. Make Docker wait for
# the mount; if the volume is missing, Docker does not start at all.

[Unit]
RequiresMountsFor=@DATA_DIR@
